# @package _global_
defaults:
  - common
  - _self_

# Mirrors ER-TRL/cfgs/env/humanoid-dir.yaml so ertrl/csro reproduce the
# official baseline hyperparameters. Dataset selection now lives in
# cfgs/data/*.yaml and algorithm-specific retuning lives in cfgs/algo_env/*/*.yaml.
env_name: 'humanoid-dir-custom'
algo_params:
  meta_batch_size: 16
  num_steps_per_eval: 600
  embedding_batch_size: 256
  embedding_mini_batch_size: 256
  club_model_loss_weight: 10.0
  club_loss_weight: 50.0
  prediction_loss_weight: 1.5
  mir_loss_weight: 2.5
