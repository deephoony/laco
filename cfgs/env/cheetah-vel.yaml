# @package _global_
defaults:
  - common
  - _self_

# Mirrors ER-TRL/cfgs/env/cheetah-vel.yaml so ertrl/csro reproduce the official
# baseline hyperparameters. Dataset selection now lives in cfgs/data/*.yaml and
# algorithm-specific retuning lives in cfgs/algo_env/*/*.yaml.
env_name: 'cheetah-vel-custom'
algo_params:
  alpha_init: 50.0
  meta_batch_size: 16
  num_steps_per_eval: 600
  embedding_batch_size: 100
  embedding_mini_batch_size: 100
  num_train_steps_per_itr: 1000
  club_model_loss_weight: 10.0
  club_loss_weight: 10.0
  prediction_loss_weight: 1.5
  mir_loss_weight: 2.5
