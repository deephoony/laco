defaults:
  - _self_
  - env: null
  - algo: null
  - data: ${env}
  - optional algo_env: ${algo}/${env}
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  

# 공통 하이퍼파라미터
latent_size: 20
net_size: 256
encoder_dims: [200, 200, 200]
use_gpu: true
gpu_id: 0
use_wandb: false
seed: 0

env_params:
  n_tasks: 40
  max_episode_steps: 200

path_to_weights: null

util_params:
  base_log_dir: ./output
  debug: false
  # Continue a killed run: point resume_from at an agent_itr_<N>.pth written by
  # a previous launch (training restarts at epoch N+1). agent.pth carries no
  # epoch in its name, so pair it with resume_epoch=<last completed epoch>.
  # Weights only -- optimizer moments and RNG state restart.
  resume_from: null
  resume_epoch: null
  
hydra:  
  output_subdir: null  
  run:  
    dir: .
